<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lets Go ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 71, 87, 0.15);
            max-width: 420px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #ff4757;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        p {
            color: #4a4a4a;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            color: #2d3436;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 16px;
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus {
            border-color: #ff4757;
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.1);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
            align-items: center;
        }

        button, .next-btn {
            padding: 14px 30px;
            font-size: 17px;
            font-weight: 600;
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            text-decoration: none;
            display: inline-block;
            width: 85%;
            letter-spacing: 0.5px;
        }

        .next-btn {
            background-color: #2ed573;
            color: white;
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.35);
            z-index: 2;
        }

        .next-btn:hover {
            background-color: #26af5f;
            transform: scale(1.03);
        }

        #noBtn {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.35);
            transition: all 0.1s ease-out;
            z-index: 9999;
            width: auto;
            padding: 12px 28px;
            font-size: 16px;
        }

        #submitBtn {
            background-color: #2ed573;
            color: white;
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.35);
            width: 100%;
        }

        #submitBtn:hover {
            background-color: #26af5f;
            transform: scale(1.03);
        }

        .hidden {
            display: none !important;
        }

        .success-message {
            color: #2ed573;
            font-size: 17px;
            font-weight: 600;
            margin-top: 15px;
        }

        #detailsText {
            font-size: 17px;
            color: #2d3436;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- PAGE 1: Initial Question -->
        <div id="pageFirst">
            <h1>❤️</h1>
            <p>අපි කොහෙහරි යමුද මැණික</p>
            
            <div class="buttons">
                <button class="next-btn" onclick="goToPlacePage()">හා යමු</button>
                <button id="noBtn" onmouseover="moveButton(event)" ontouchstart="moveButton(event)">මට බැ</button>
            </div>
        </div>

        <!-- PAGE 2: Place Selection -->
        <div id="pagePlace" class="hidden">
            <h1>✨</h1>
            <p>ඔයා ආස තැනකට අපි යමු, කොහෙද සුදු අපි යන්නෙ? 👻</p>
            
            <div class="form-group">
                <label for="placeInput">යන්නෙ කොහෙද:</label>
                <input type="text" id="placeInput" placeholder="Restaurant, Beach, Whatever...">
            </div>

            <div class="buttons" style="align-items: center;">
                <button id="submitBtn" onclick="sendWhatsApp()">මෙහේ යමු හොදේ...🥳</button>
            </div>
        </div>

        <!-- PAGE 3: Success & WhatsApp Redirect -->
        <div id="pageSuccess" class="hidden">
            <h1>Yay! 🎉</h1>
            <p id="detailsText">යේ යේ අපි යන්නයි යන්නේ...</p>
            <p class="success-message">WhatsApp msg එක එවන්න... ❤️</p>
        </div>
    </div>

    <script>
        // Font එක load වෙලා ඉවර වුණාම (button size හරියටම ආවට පස්සේ) position එක හදන්න
        window.addEventListener('load', () => {
            positionNoButtonInitial();
        });

        // Screen එකේ size එක වෙනස් වෙද්දි (උදා: phone එක හරවද්දි) button එක ආයෙත් හදාගන්න
        window.addEventListener('resize', () => {
            const noBtn = document.getElementById('noBtn');
            // Button එක දැනටමත් move වෙලා නැත්නම් විතරක් යාවත්කාලීන කරන්න
            if (noBtn.getAttribute('data-moved') !== 'true') {
                positionNoButtonInitial();
            }
        });

        function positionNoButtonInitial() {
            const nextBtn = document.querySelector('.next-btn');
            const noBtn = document.getElementById('noBtn');
            
            // 'හා යමු' button එක screen එකේ තියෙන තැන මැනගන්නවා
            const nextBtnRect = nextBtn.getBoundingClientRect();
            
            // 'fixed' දාන නිසා button එක card එකෙන් සම්පූර්ණයෙන්ම වෙන් වෙනවා (අනිත් දේවල් හෙල්ලෙන්නේ නෑ)
            noBtn.style.position = 'fixed';
            noBtn.style.transform = 'none'; 
            noBtn.style.margin = '0';
            
            // 'හා යමු' button එකට හරියටම යටින් 'මට බැ' button එක තැබීම
            noBtn.style.top = (nextBtnRect.bottom + 15) + 'px';
            noBtn.style.left = (nextBtnRect.left + (nextBtnRect.width / 2) - (noBtn.offsetWidth / 2)) + 'px';
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            noBtn.setAttribute('data-moved', 'true'); // Move වුණා කියලා සලකුණු කරගන්නවා
            
            // Screen එකෙන් පිට පනින්නේ නැති වෙන්න 15px ක margin එකක් (padding) තියාගන්නවා
            const padding = 15;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            // අහඹු තැන් හදන්නේ screen සීමාව ඇතුලත (padding සීමාවෙන් ඇතුලේ) පමණයි
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            noBtn.style.top = randomY + 'px';
            noBtn.style.left = randomX + 'px';
        }

        function goToPlacePage() {
            document.getElementById('noBtn').style.display = 'none';
            document.getElementById('pageFirst').classList.add('hidden');
            document.getElementById('pagePlace').classList.remove('hidden');
        }

        function sendWhatsApp() {
            const chosenPlace = document.getElementById('placeInput').value.trim();

            if (!chosenPlace) {
                alert("යන්න ආස තැනක් Type කරන්න ❤️");
                document.getElementById('placeInput').focus();
                return;
            }

            document.getElementById('detailsText').innerHTML = `
                අපි යන්නේ:<br>
                📍 <b>${chosenPlace}</b><br><br>
                මම ගොඩාක් ආදරෙයි! 🥰
            `;

            document.getElementById('pagePlace').classList.add('hidden');
            document.getElementById('pageSuccess').classList.remove('hidden');

            const myPhoneNumber = "+94704904030"; 
            const message = encodeURIComponent(`සුදූ... අපි යමු ${chosenPlace}.. මම ගොඩාක් ආදරෙයි මැණික..`);

            setTimeout(() => {
                window.location.href = `https://wa.me/${myPhoneNumber}?text=${message}`;
            }, 1000);
        }
    </script>

</body>
</html>
